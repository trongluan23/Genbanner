<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - AI Banner Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%; max-width: 450px;
        }
        .register-header {
            background: var(--primary-gradient);
            padding: 35px 30px;
            text-align: center;
            color: white;
        }
        .register-header .logo-icon {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
        }
        .register-header .logo-icon i { font-size: 32px; }
        .register-header h2 { margin: 0; font-weight: 700; }
        .register-header p { margin: 10px 0 0; opacity: 0.9; font-size: 0.95rem; }
        .register-body { padding: 35px 30px; }
        .form-floating { margin-bottom: 18px; }
        .form-floating .form-control {
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            padding: 16px;
            height: 56px;
            font-size: 1rem;
        }
        .form-floating .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }
        .form-floating label { padding: 16px; color: #888; }
        .btn-register {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .divider {
            display: flex; align-items: center;
            margin: 20px 0; color: #aaa;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #e8e8e8;
        }
        .divider span { padding: 0 15px; font-size: 0.9rem; }
        .login-link { text-align: center; color: #666; }
        .login-link a { color: #667eea; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .alert { border-radius: 12px; border: none; margin-bottom: 20px; }
        .password-strength { height: 4px; border-radius: 2px; margin-top: 8px; transition: all 0.3s; }
        .strength-weak { background: #ef4444; width: 33%; }
        .strength-medium { background: #f59e0b; width: 66%; }
        .strength-strong { background: #10b981; width: 100%; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <div class="logo-icon"><i class="bi bi-palette"></i></div>
            <h2>Tạo Tài Khoản</h2>
            <p>Đăng ký để bắt đầu tạo banner</p>
        </div>
        <div class="register-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                            <i class="bi bi-{{ 'exclamation-circle' if category == 'error' else 'check-circle' }} me-2"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" id="registerForm">
                <div class="form-floating">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Tên người dùng" required>
                    <label for="username"><i class="bi bi-person me-2"></i>Tên người dùng</label>
                </div>
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                    <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Mật khẩu" required minlength="6">
                    <label for="password"><i class="bi bi-lock me-2"></i>Mật khẩu</label>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Xác nhận mật khẩu" required>
                    <label for="confirm_password"><i class="bi bi-lock-fill me-2"></i>Xác nhận mật khẩu</label>
                </div>
                <button type="submit" class="btn btn-register mt-3">
                    <i class="bi bi-person-plus me-2"></i>Đăng Ký
                </button>
            </form>
            <div class="divider"><span>hoặc</span></div>
            <p class="login-link">Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('password').addEventListener('input', function() {
            const strength = document.getElementById('passwordStrength');
            const val = this.value;
            strength.className = 'password-strength';
            if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) {
                strength.classList.add('strength-strong');
            } else if (val.length >= 6) {
                strength.classList.add('strength-medium');
            } else if (val.length > 0) {
                strength.classList.add('strength-weak');
            }
        });
    </script>
</body>
</html>
