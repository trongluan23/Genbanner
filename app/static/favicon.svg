<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="20" fill="url(#gradient)"/>
  
  <!-- Palette icon -->
  <g transform="translate(50, 50)">
    <!-- Main palette shape -->
    <ellipse cx="0" cy="0" rx="28" ry="28" fill="white" opacity="0.95"/>
    
    <!-- Thumb hole -->
    <ellipse cx="12" cy="12" rx="6" ry="6" fill="url(#gradient)"/>
    
    <!-- Color dots -->
    <circle cx="-8" cy="-12" r="4" fill="#ef4444"/>
    <circle cx="8" cy="-12" r="4" fill="#f59e0b"/>
    <circle cx="-15" cy="0" r="4" fill="#10b981"/>
    <circle cx="15" cy="0" r="4" fill="#3b82f6"/>
    <circle cx="-8" cy="12" r="4" fill="#8b5cf6"/>
  </g>
</svg>
